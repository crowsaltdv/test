[package]
name = "horizon-server-files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dedicated server's vanilla files: server.properties, eula.txt, ops, whitelist and bans, and account lookups"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-protocol = { path = "../horizon-protocol" }
horizon-world = { path = "../horizon-world" }
log = "0.4"
getrandom = "0.3"
# Online mode: finding accounts by name (the services' profiles endpoint).
# Secure chat: the services' public keys arrive base64-encoded.
base64 = "0.22"

# HTTPS (rustls on ring) everywhere but in a browser (Emscripten, docs/web.md): ring has no
# random source there and a page can't open a TCP socket, so its requests fail as unreachable.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "emscripten")'.dependencies]
ureq = { version = "2", default-features = false }

[lints]
workspace = true
