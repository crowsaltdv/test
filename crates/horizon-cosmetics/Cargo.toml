[package]
name = "horizon-cosmetics"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Cosmetic items drawn on players by Horizon clients: the item format, attachment to the player model's bones, simple animations, and what other players wear (fetched and cached)"

[dependencies]
horizon-addresses = { path = "../horizon-addresses" }
base64 = "0.22"
glam = "0.30"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

# HTTPS (rustls on ring) everywhere but in a browser (Emscripten, docs/web.md): ring has no
# random source there and a page can't open a TCP socket, so its requests fail as unreachable.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "emscripten")'.dependencies]
ureq = { version = "2", default-features = false }

[lints]
workspace = true
