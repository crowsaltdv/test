<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
  <meta name="theme-color" content="#16181f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Horizon in your browser</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #101318; color: #e8edf2; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 16px; background: #1a2029; }
    h1 { margin: 0 auto 0 0; font-size: 17px; }
    button, input::file-selector-button { border: 1px solid #465366; border-radius: 6px; padding: 8px 12px; background: #283446; color: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    button[hidden] { display: none; }
    #fullscreen { white-space: nowrap; }
    #status { color: #aab7c8; min-width: 190px; }
    #loading-progress { flex: 0 0 100%; width: 100%; height: 7px; accent-color: #8b9dff; }
    #loading-progress[hidden] { display: none; }
    main { min-height: 0; display: grid; place-items: center; padding: 12px; }
    #canvas { width: min(100%, 1600px); height: min(100%, 900px); min-height: 320px; background: #000; outline: none; }
    /* Fullscreen is the game and nothing else: no title, buttons or status. Escape leaves it. */
    body:fullscreen { grid-template-rows: minmax(0, 1fr); overflow: hidden; }
    body:fullscreen header { display: none; }
    body:fullscreen main { padding: 0; }
    body:fullscreen #canvas { width: 100%; height: 100%; max-width: none; max-height: none; min-height: 0; }
    /* The browser's own fullscreen (F11) is no element's fullscreen, so `:fullscreen` doesn't match it. */
    @media (display-mode: fullscreen) {
      body { grid-template-rows: minmax(0, 1fr); overflow: hidden; }
      body header { display: none; }
      body main { padding: 0; }
      body #canvas { width: 100%; height: 100%; max-width: none; max-height: none; min-height: 0; }
    }
    #files { display: none; }
    @media (max-width: 650px) { header { gap: 8px; } h1 { width: 100%; } #status { flex: 1; } }
  </style>
</head>
<body>
  <header>
    <h1>Horizon · Minecraft Java Edition 26.3</h1>
    <button id="play" type="button" disabled>Play</button>
    <button id="load-folder" type="button" hidden>Load a folder instead…</button>
    <button id="install" type="button">Install app</button>
    <button id="reload" type="button">Reload game</button>
    <button id="fullscreen" type="button" aria-pressed="false">Fullscreen</button>
    <button id="copy-log" type="button" title="Copy the game's recent log lines">Copy game log</button>
    <input id="files" type="file" webkitdirectory directory multiple>
    <span id="status">Loading Horizon…</span>
    <progress id="loading-progress" aria-label="Loading Horizon"></progress>
  </header>
  <main><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></main>
  <script>
    const status = document.querySelector('#status');
    const loadingProgress = document.querySelector('#loading-progress');
    const picker = document.querySelector('#files');
    const play = document.querySelector('#play');
    const loadFolder = document.querySelector('#load-folder');
    let runtimeReady = false;
    let gameStarted = false;
    let launching = false;
    let savedPaths = null;
    let preparedHint = '';
    let showFolderFallback = false;
    let runtimeDependenciesMax = 0;
    // Replaced by web/pack.ps1 for builds that compile native mods into the game.
    const BROWSER_NATIVE_MODS = ["accurate_block_placement","appleskin","armor_status","armorhud","chatheads","classic_zoom","connected_textures","coords_hud","crosshair_indicator","fast_items","fly_speed","fps_overlay","freecam_plus","fullbright_horizon","keystrokes","minimap","motion_blur","recipes","rightharvest","skins_3d","status_effect_hud","toggle_sprint","zoom"];

    function showProgress(message, completed = null, total = null) {
      status.textContent = message;
      loadingProgress.hidden = false;
      if (Number.isFinite(completed) && Number.isFinite(total) && total > 0) {
        loadingProgress.max = total;
        loadingProgress.value = Math.max(0, Math.min(completed, total));
      } else {
        loadingProgress.max = 1;
        loadingProgress.removeAttribute('value');
      }
    }
    function hideProgress() {
      loadingProgress.hidden = true;
    }

    const DB_NAME = 'horizon-prepared-resources';
    const DB_VERSION = 2;
    function openResourceDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
          if (!db.objectStoreNames.contains('game-files')) db.createObjectStore('game-files');
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Could not open browser storage'));
      });
    }
    function requestValue(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Browser storage request failed'));
      });
    }
    function transactionDone(transaction) {
      return new Promise((resolve, reject) => {
        transaction.oncomplete = () => resolve();
        transaction.onabort = transaction.onerror = () => reject(transaction.error || new Error('Browser storage transaction failed'));
      });
    }
    async function readSavedPaths() {
      const db = await openResourceDb();
      try {
        const tx = db.transaction('meta', 'readonly');
        const done = transactionDone(tx);
        const saved = await requestValue(tx.objectStore('meta').get('resources'));
        await done;
        return Array.isArray(saved?.paths) && saved.paths.includes('horizon-resources.json') ? saved.paths : null;
      } finally {
        db.close();
      }
    }
    async function savePreparedFiles(entries) {
      const db = await openResourceDb();
      try {
        const clear = db.transaction(['files', 'meta'], 'readwrite');
        const cleared = transactionDone(clear);
        clear.objectStore('files').clear();
        clear.objectStore('meta').delete('resources');
        await cleared;
        for (let i = 0; i < entries.length; i += 128) {
          const batch = entries.slice(i, i + 128);
          const tx = db.transaction('files', 'readwrite');
          const done = transactionDone(tx);
          for (const entry of batch) tx.objectStore('files').put(entry.blob, entry.path);
          await done;
          showProgress(`Saving prepared files in this browser (${Math.min(i + batch.length, entries.length)}/${entries.length})…`, i + batch.length, entries.length);
        }
        const save = db.transaction('meta', 'readwrite');
        const saved = transactionDone(save);
        save.objectStore('meta').put({ paths: entries.map(entry => entry.path), savedAt: Date.now() }, 'resources');
        await saved;
      } finally {
        db.close();
      }
    }
    async function loadSavedFiles(paths) {
      const db = await openResourceDb();
      try {
        const tx = db.transaction('files', 'readonly');
        const done = transactionDone(tx);
        const store = tx.objectStore('files');
        const reads = paths.map(path => requestValue(store.get(path)));
        const blobs = await Promise.all(reads);
        await done;
        // A saved value is a Blob; an older save, or one interrupted, can hold a raw byte array.
        const missing = paths.findIndex((_, i) =>
          !(blobs[i] instanceof Blob || blobs[i] instanceof ArrayBuffer || ArrayBuffer.isView(blobs[i])));
        if (missing !== -1) throw new Error(`Saved file is missing: ${paths[missing]}`);
        return paths.map((path, i) => ({ path, blob: blobs[i] instanceof Blob ? blobs[i] : new Blob([blobs[i]]) }));
      } finally {
        db.close();
      }
    }
    // WASMFS's JavaScript API has no isDir, isFile or analyzePath: the file type is in stat's mode.
    const S_IFMT = 0o170000, S_IFDIR = 0o040000, S_IFREG = 0o100000, S_IFLNK = 0o120000;
    function pathExists(path) {
      try { Module.FS.stat(path); return true; } catch { return false; }
    }
    function listGameFiles(FS) {
      const result = [];
      function visit(directory, prefix) {
        for (const name of FS.readdir(directory)) {
          if (name === '.' || name === '..') continue;
          // The game's rebuildable cache holds a mirror of /resources made of links (the overlay of
          // the mods that are on): saving it would copy every game file again, so it isn't kept.
          if (name === '.horizon-cache' && !prefix) continue;
          const path = `${directory}/${name}`;
          const relative = prefix ? `${prefix}/${name}` : name;
          if (FS.lstat && (FS.lstat(path).mode & S_IFMT) === S_IFLNK) continue;
          const stat = FS.stat(path);
          const type = stat.mode & S_IFMT;
          if (type === S_IFDIR) visit(path, relative);
          else if (type === S_IFREG) result.push({ path: relative, size: stat.size, mtime: Number(stat.mtime) });
        }
      }
      visit('/game', '');
      return result;
    }
    async function readGameManifest(db) {
      const tx = db.transaction('meta', 'readonly');
      const done = transactionDone(tx);
      const manifest = await requestValue(tx.objectStore('meta').get('game-files'));
      await done;
      return {
        files: Array.isArray(manifest?.files) ? manifest.files : [],
        savedAt: Number(manifest?.savedAt) || 0,
      };
    }
    async function restoreSavedWorlds() {
      const db = await openResourceDb();
      try {
        // Each file gets back the modification time it was saved with, so the first snapshot after
        // a reload doesn't take every restored file for a changed one.
        const mtimes = new Map((await readGameManifest(db)).files.map(file => [file.path, file.mtime]));
        const tx = db.transaction('game-files', 'readonly');
        const done = transactionDone(tx);
        await new Promise((resolve, reject) => {
          const request = tx.objectStore('game-files').openCursor();
          request.onerror = () => reject(request.error || new Error('Could not read saved worlds'));
          request.onsuccess = () => {
            const cursor = request.result;
            if (!cursor) { resolve(); return; }
            const relative = String(cursor.key);
            if (relative && !relative.startsWith('/') && !relative.split('/').includes('..')) {
              const target = `/game/${relative}`;
              const parent = target.slice(0, target.lastIndexOf('/'));
              Module.FS.mkdirTree(parent);
              const bytes = cursor.value instanceof Uint8Array ? cursor.value : new Uint8Array(cursor.value);
              Module.FS.writeFile(target, bytes);
              const mtime = mtimes.get(relative);
              if (Number.isFinite(mtime)) {
                try { Module.FS.utime(target, mtime * 1000, mtime * 1000); } catch { /* keeps the restore time */ }
              }
            }
            cursor.continue();
          };
        });
        await done;
      } finally {
        db.close();
      }
    }
    let worldSnapshotPromise = null;
    function saveWorldsToBrowser() {
      if (!gameStarted || !pathExists('/game')) return Promise.resolve();
      if (!worldSnapshotPromise) {
        worldSnapshotPromise = writeWorldSnapshot().finally(() => { worldSnapshotPromise = null; });
      }
      return worldSnapshotPromise;
    }
    async function writeWorldSnapshot() {
      let db;
      try {
        db = await openResourceDb();
        const { files: previous, savedAt: previousSavedAt } = await readGameManifest(db);
        const snapshotStart = Date.now();
        // File times have a resolution of a second: a file written again in the second the last
        // snapshot was taken, at the same size, looks unchanged, so those are saved again.
        const recent = Math.floor(previousSavedAt / 1000) - 1;
        const previousByPath = new Map(previous.map(file => [file.path, file]));
        const current = listGameFiles(Module.FS);
        const currentPaths = new Set(current.map(file => file.path));
        const deleted = previous.filter(file => !currentPaths.has(file.path)).map(file => file.path);
        for (let i = 0; i < deleted.length; i += 64) {
          const tx = db.transaction('game-files', 'readwrite');
          const done = transactionDone(tx);
          const store = tx.objectStore('game-files');
          for (const path of deleted.slice(i, i + 64)) store.delete(path);
          await done;
        }
        const changed = current.filter(file => {
          const old = previousByPath.get(file.path);
          return !old || old.size !== file.size || old.mtime !== file.mtime || file.mtime >= recent;
        });
        for (let i = 0; i < changed.length; i += 4) {
          const batch = changed.slice(i, i + 4).map(file => ({
            path: file.path,
            bytes: new Uint8Array(Module.FS.readFile(`/game/${file.path}`)),
          }));
          const tx = db.transaction('game-files', 'readwrite');
          const done = transactionDone(tx);
          const store = tx.objectStore('game-files');
          for (const file of batch) store.put(file.bytes, file.path);
          await done;
        }
        const tx = db.transaction('meta', 'readwrite');
        const done = transactionDone(tx);
        tx.objectStore('meta').put({ files: current, savedAt: snapshotStart }, 'game-files');
        await done;
        if (changed.length || deleted.length) console.info(`Horizon: saved ${current.length} world files in this browser`);
      } catch (error) {
        console.error('Horizon: could not persist world saves in this browser:', error);
        status.textContent = 'Could not save world data in browser storage. Check available storage space.';
      } finally {
        db?.close();
      }
    }
    // The browser build starts at render and simulation distance 8, not 12: each chunk of view costs
    // WebGL calls, and 12 stalled the page for hundreds of milliseconds while terrain loaded. Options
    // saved before that still say 12, which was only the old default: they move to 8 once, and what
    // is chosen in the game's options afterwards stays.
    function migrateWebDefaults() {
      const key = 'horizon-web-defaults-1';
      try {
        if (localStorage.getItem(key)) return;
        if (pathExists('/game/options.txt')) {
          const text = new TextDecoder().decode(Module.FS.readFile('/game/options.txt'));
          const next = text.replace(/^(renderDistance|simulationDistance):12[ \t\r]*$/gm, '$1:8');
          if (next !== text) Module.FS.writeFile('/game/options.txt', new TextEncoder().encode(next));
        }
        localStorage.setItem(key, '1');
      } catch (error) {
        console.warn('Could not move saved options to the browser defaults:', error);
      }
    }
    // A .hmod put on the page (dropped, or picked with the Mods page's Upload Mod button) is
    // installed: it goes in /game/horizon-mods, the folder the game reads content mods from, is
    // turned on in horizon-mods.txt, and the next snapshot keeps both in this browser. Files that
    // arrive before the game starts wait until the saved files are restored.
    const pendingMods = [];
    // A .hmod is a zip: its id is `id = "..."` in horizon-mod.toml. Read here, so the mod can be
    // turned on without the game's help.
    async function hmodId(bytes) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let end = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { end = i; break; }
      }
      if (end < 0) throw new Error('not a .hmod (a zip file)');
      const count = view.getUint16(end + 10, true);
      let at = view.getUint32(end + 16, true);
      for (let n = 0; n < count && view.getUint32(at, true) === 0x02014b50; n++) {
        const method = view.getUint16(at + 10, true);
        const size = view.getUint32(at + 20, true);
        const nameLength = view.getUint16(at + 28, true);
        const extraLength = view.getUint16(at + 30, true);
        const commentLength = view.getUint16(at + 32, true);
        const local = view.getUint32(at + 42, true);
        const name = new TextDecoder().decode(bytes.subarray(at + 46, at + 46 + nameLength));
        if (name === 'horizon-mod.toml') {
          const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
          let data = bytes.subarray(start, start + size);
          if (method === 8) {
            const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            data = new Uint8Array(await new Response(stream).arrayBuffer());
          } else if (method !== 0) {
            throw new Error('unsupported zip compression');
          }
          const match = /^\s*id\s*=\s*"([^"]+)"/m.exec(new TextDecoder().decode(data));
          return match ? match[1] : null;
        }
        at += 46 + nameLength + extraLength + commentLength;
      }
      throw new Error('not a Horizon mod: it has no horizon-mod.toml');
    }
    function writeHmod(name, bytes, id) {
      Module.FS.mkdirTree('/game/horizon-mods');
      Module.FS.writeFile(`/game/horizon-mods/${name}`, bytes);
      if (id && /^[a-z0-9_\-]+$/.test(id)) {
        const line = `mod.${id}:true`;
        const path = '/game/horizon-mods.txt';
        const text = pathExists(path) ? new TextDecoder().decode(Module.FS.readFile(path)) : '';
        const lines = [...new Set(text.split('\n').filter(l => l && !l.startsWith(`mod.${id}:`)))];
        lines.push(line);
        Module.FS.writeFile(path, new TextEncoder().encode(lines.join('\n') + '\n'));
      }
    }
    function flushPendingMods() {
      for (const { name, bytes, id } of pendingMods.splice(0)) writeHmod(name, bytes, id);
    }
    async function acceptHmods(files) {
      const mods = Array.from(files).filter(file => /\.hmod$/i.test(file.name));
      if (!mods.length) return false;
      const done = [];
      for (const file of mods) {
        try {
          if (file.size > 64 * 1024 * 1024) throw new Error('larger than 64 MB');
          const bytes = new Uint8Array(await file.arrayBuffer());
          const id = await hmodId(bytes);
          const name = (id && /^[a-z0-9_\-]+$/.test(id) ? id : file.name.replace(/\.hmod$/i, '').replace(/[^\w\-]/g, '_')) + '.hmod';
          if (runtimeReady && (gameStarted || pathExists('/game'))) writeHmod(name, bytes, id);
          else pendingMods.push({ name, bytes, id });
          done.push(id || name);
        } catch (error) {
          console.error(error);
          status.textContent = `${file.name} was not installed: ${error.message || error}`;
          return false;
        }
      }
      if (!gameStarted) {
        status.textContent = `${done.join(', ')} will be installed and turned on when the game starts.`;
        return true;
      }
      status.textContent = `Installed ${done.join(', ')}.`;
      // The game reads its mods once, when it starts: it has to start again to see this one.
      if (confirm(`Installed ${done.join(', ')} and turned it on.\n\nReload the game now to load it? Anything not saved in a world is lost.`)) {
        await saveWorldsToBrowser();
        window.location.reload();
      } else {
        status.textContent = `Installed ${done.join(', ')}. Use Reload game to load it.`;
      }
      return true;
    }
    // The game's Mods page asks for this (Upload Mod...): a file picker for a .hmod.
    window.horizonUploadHmod = () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.hmod';
      input.addEventListener('change', () => { if (input.files.length) acceptHmods(input.files); });
      input.click();
    };
    addEventListener('dragover', event => {
      if (Array.from(event.dataTransfer?.types || []).includes('Files')) event.preventDefault();
    });
    addEventListener('drop', event => {
      event.preventDefault();
      acceptHmods(event.dataTransfer?.files || []);
    });
    async function launch(args) {
      if (gameStarted || launching) return;
      launching = true;
      updateButtons();
      showProgress('Restoring saved worlds from this browser…');
      Module.FS.mkdirTree('/game');
      try {
        await restoreSavedWorlds();
        migrateWebDefaults();
      } catch (error) {
        console.error(error);
        status.textContent = `Could not restore saved worlds; starting without browser saves: ${error.message || error}`;
      }
      try {
        seedBrowserNativeModsOff();
      } catch (error) {
        console.error('Could not set the browser mod defaults:', error);
      }
      launching = false;
      gameStarted = true;
      updateButtons();
      showProgress('Starting Horizon…');
      flushPendingMods();
      Module.callMain(args);
      hideProgress();
      status.textContent = 'Horizon is running. Worlds are saved in this browser automatically. Click the game to capture the mouse.';
    }
    function seedBrowserNativeModsOff() {
      if (!BROWSER_NATIVE_MODS.length) return;
      const path = '/game/horizon-mods.txt';
      const current = pathExists(path)
        ? new TextDecoder().decode(Module.FS.readFile(path))
        : '';
      const known = new Set(Array.from(
        current.matchAll(/^mod\.([a-z0-9_-]+):(?:true|false)[ \t\r]*$/gm),
        match => match[1],
      ));
      const missing = BROWSER_NATIVE_MODS.filter(id => !known.has(id));
      if (!missing.length) return;
      const separator = current && !current.endsWith('\n') ? '\n' : '';
      const defaults = missing.map(id => `mod.${id}:false\n`).join('');
      Module.FS.writeFile(path, new TextEncoder().encode(current + separator + defaults));
    }
    function updateButtons() {
      play.disabled = !runtimeReady || gameStarted || launching;
      // The folder picker exists for a server that has no prepared folder at all; the deployed site
      // without one, say. While the game's files come from the server it stays out of the way.
      loadFolder.hidden = !showFolderFallback;
    }
    function selectedEntries(files) {
      return Array.from(files).map(file => {
        const path = file.webkitRelativePath.split('/').slice(1).join('/');
        if (!path || path.startsWith('/') || path.split('/').includes('..')) return null;
        return { path, blob: file.slice(0, file.size, file.type), source: file };
      }).filter(Boolean);
    }
    async function copyFilesIntoGame(entries, label) {
      const FS = Module.FS;
      FS.mkdirTree('/resources');
      for (let i = 0; i < entries.length; i++) {
        const { path, blob } = entries[i];
        const target = `/resources/${path}`;
        FS.mkdirTree(target.slice(0, target.lastIndexOf('/')));
        FS.writeFile(target, new Uint8Array(await blob.arrayBuffer()));
        if (i % 100 === 0 || i + 1 === entries.length) {
          showProgress(`${label} (${i + 1}/${entries.length} files)…`, i + 1, entries.length);
        }
      }
    }

    // The server in front of the page (web/serve.mjs, or web/server.mjs on your own machine) serves
    // the prepared 26.3 folder it finds next to the repository: `26.3` beside `.local/`, or
    // `horizon-prepare`'s output. The page copies it into /resources by itself, so Play is the only
    // button. A server without the folder answers 404 with where it looked; the folder arrives as
    // one stream of frames (see web/prepared-resources.mjs), not one request per file: 23 000.
    async function loadPreparedFromServer() {
      let response;
      showProgress('Checking for prepared game files on the server…');
      try {
        response = await fetch('/prepared-resources.bin', { cache: 'no-store' });
      } catch {
        hideProgress();
        return false;
      }
      if (!response.ok) {
        // Says which folders the server looked in, instead of leaving Play unexplained.
        preparedHint = (await response.text().catch(() => '')).trim();
        hideProgress();
        return false;
      }
      const total = Number(response.headers.get('X-Horizon-Files')) || 0;
      showProgress(`Installing prepared game files (${total} files)…`, 0, total);
      // The copy is kept in this browser while it streams in, so the next start copies nothing:
      // files go to IndexedDB in small batches, and the manifest naming them is written last, so a
      // start never sees half a copy. A browser that cannot keep them (a full quota, private mode)
      // still plays; it just copies again next time.
      const keptPaths = [];
      let storeDb = null, storeFailed = false, storeBatch = [], storeBytes = 0;
      async function flushStore(force) {
        if (!storeBatch.length && !force) return;
        if (storeFailed) { storeBatch = []; storeBytes = 0; return; }
        const batch = storeBatch.splice(0);
        storeBytes = 0;
        try {
          const tx = storeDb.transaction('files', 'readwrite');
          const done = transactionDone(tx);
          for (const { path, bytes } of batch) tx.objectStore('files').put(bytes, path);
          await done;
        } catch (error) {
          console.warn('Prepared files could not be saved for the next visit:', error);
          storeFailed = true;
        }
      }
      try {
        storeDb = await openResourceDb();
        const clear = storeDb.transaction('files', 'readwrite');
        const cleared = transactionDone(clear);
        clear.objectStore('files').clear();
        await cleared;
      } catch (error) {
        console.warn('Prepared files could not be saved for the next visit:', error);
        storeFailed = true;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      const FS = Module.FS;
      const dirs = new Set(['/resources']);
      FS.mkdirTree('/resources');
      const chunks = [];
      let queued = 0;
      async function need(count) {
        while (queued < count) {
          const { value, done } = await reader.read();
          if (done) throw new Error('The prepared files ended early');
          if (value.length) { chunks.push(value); queued += value.length; }
        }
      }
      function take(count) {
        const out = new Uint8Array(count);
        let filled = 0;
        while (filled < count) {
          const chunk = chunks[0];
          const want = Math.min(chunk.length, count - filled);
          out.set(chunk.subarray(0, want), filled);
          filled += want;
          if (want === chunk.length) chunks.shift();
          else chunks[0] = chunk.subarray(want);
        }
        queued -= count;
        return out;
      }
      const length = bytes => (bytes[0] | (bytes[1] << 8) | (bytes[2] << 16) | (bytes[3] << 24)) >>> 0;
      let copied = 0;
      let manifest = false;
      for (;;) {
        // The stream ends at a frame boundary; EOF decided by the reader, not a count.
        while (queued === 0) {
          const { value, done } = await reader.read();
          if (done) { queued = -1; break; }
          if (value.length) { chunks.push(value); queued += value.length; }
        }
        if (queued < 0) break;
        await need(4);
        const pathLength = length(take(4));
        await need(pathLength);
        const path = decoder.decode(take(pathLength));
        await need(4);
        const size = length(take(4));
        if (!path || path.startsWith('/') || path.split('/').includes('..')) throw new Error(`Bad prepared path: ${path}`);
        await need(size);
        const target = `/resources/${path}`;
        const parent = target.slice(0, target.lastIndexOf('/'));
        if (!dirs.has(parent)) { FS.mkdirTree(parent); dirs.add(parent); }
        const bytes = take(size);
        FS.writeFile(target, bytes);
        if (path === 'horizon-resources.json') manifest = true;
        keptPaths.push(path);
        if (!storeFailed) {
          storeBatch.push({ path, bytes: new Blob([bytes]) });
          storeBytes += size;
          if (storeBatch.length >= 32 || storeBytes >= 32 * 1024 * 1024) await flushStore(false);
        }
        copied++;
        if (copied % 100 === 0 || (total && copied === total)) {
          showProgress(`Installing prepared game files (${copied}${total ? `/${total}` : ''})…`, copied, total);
        }
      }
      if (!manifest) throw new Error('The prepared files have no top-level horizon-resources.json');
      await flushStore(true);
      if (storeFailed) {
        try { storeDb?.close(); } catch { /* already closed */ }
      } else {
        try {
          const tx = storeDb.transaction(['files', 'meta'], 'readwrite');
          const done = transactionDone(tx);
          tx.objectStore('meta').put({ paths: keptPaths, savedAt: Date.now() }, 'resources');
          await done;
          savedPaths = keptPaths;
        } catch (error) {
          console.warn('Prepared files could not be saved for the next visit:', error);
        } finally {
          try { storeDb.close(); } catch { /* already closed */ }
        }
      }
      return true;
    }

    // Play always prefers the prepared 26.3 files already saved in this browser. The server or
    // folder picker is needed only for the first install or if the saved copy is incomplete.
    play.addEventListener('click', async () => {
      if (!runtimeReady || gameStarted || launching) return;
      play.disabled = true;
      updateButtons();
      try {
        if (savedPaths) {
          try {
            showProgress('Reading prepared files saved in this browser…');
            const entries = await loadSavedFiles(savedPaths);
            await copyFilesIntoGame(entries, 'Loading prepared files saved in this browser');
            await launch(['--resources', '/resources', '--game-dir', '/game']);
            return;
          } catch (error) {
            console.warn('The saved prepared files did not load; copying them again:', error);
            savedPaths = null;
          }
        }
        if (await loadPreparedFromServer()) {
          await launch(['--resources', '/resources', '--game-dir', '/game']);
          return;
        }
        status.textContent = preparedHint || 'This server has no prepared 26.3 folder.';
        showFolderFallback = true;
      } catch (error) {
        console.error(error);
        hideProgress();
        status.textContent = `Could not start: ${error.message || error}`;
      } finally {
        updateButtons();
      }
    });
    loadFolder.addEventListener('click', () => picker.click());
    document.querySelector('#copy-log').addEventListener('click', async () => {
      const text = gameLog.join('\n');
      try { await navigator.clipboard.writeText(text); status.textContent = `Copied ${gameLog.length} log lines.`; }
      catch { console.log(text); status.textContent = 'Could not copy; the log is in the browser console.'; }
    });
    document.querySelector('#reload').addEventListener('click', async () => {
      status.textContent = 'Saving world data before reloading…';
      await saveWorldsToBrowser();
      window.location.reload();
    });
    const fullscreenButton = document.querySelector('#fullscreen');
    fullscreenButton.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.body.requestFullscreen();
        }
      } catch (error) {
        console.error('Could not change fullscreen mode:', error);
        status.textContent = `Could not change fullscreen mode: ${error.message || error}`;
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const active = document.fullscreenElement === document.body;
      fullscreenButton.textContent = active ? 'Exit fullscreen' : 'Fullscreen';
      fullscreenButton.setAttribute('aria-pressed', String(active));
    });
    // Installed app: web/sw.js keeps the page, Emscripten's loader and the wasm on the player's
    // disk, and the browser then offers Install. The page's own button shows that offer, rather
    // than leaving it in the browser's menu; a browser that has not made the offer yet is told
    // where its own entry is.
    const install = document.querySelector('#install');
    let installOffer = null;
    if (matchMedia('(display-mode: standalone)').matches) install.hidden = true;
    addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installOffer = event;
    });
    install.addEventListener('click', async () => {
      if (!installOffer) {
        status.textContent = 'This browser has not offered to install the page yet: use its own Install entry (in Chrome and Edge, the icon at the right of the address bar, or Install in the menu).';
        return;
      }
      const offer = installOffer;
      installOffer = null;
      install.hidden = true;
      offer.prompt();
      await offer.userChoice.catch(() => {});
    });
    addEventListener('appinstalled', () => {
      install.hidden = true;
      status.textContent = 'Horizon is installed. It starts from this PC from now on.';
      void warmApp();
    });
    // The loader and the wasm were fetched before the service worker controlled this page (on a
    // first visit, before the worker existed at all), so its cache holds the page and the icons but
    // not them. Installing asks for them once, and every start of the installed app fills in
    // whatever is missing; a browser visit does not, since they are 70 MB and most visitors never
    // install.
    async function warmApp() {
      const loader = document.querySelector('script[src$="horizon-client.js"]')?.src;
      if (!loader || !('serviceWorker' in navigator)) return;
      try {
        const missing = [];
        for (const url of [loader, new URL('horizon_client.wasm', loader).href]) {
          if (!(await caches.match(url))) missing.push(url);
        }
        if (!missing.length) return;
        const registration = await navigator.serviceWorker.ready;
        (navigator.serviceWorker.controller || registration.active)?.postMessage({
          type: 'warm',
          urls: missing,
        });
      } catch (error) {
        console.warn('Horizon: could not keep the app for offline use:', error);
      }
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(error => {
        console.warn('Horizon: no service worker, so the app cannot be installed:', error);
      });
    }
    picker.addEventListener('change', async () => {
      if (!picker.files.length || gameStarted) return;
      play.disabled = true;
      try {
        const entries = selectedEntries(picker.files);
        if (!entries.some(entry => entry.path === 'horizon-resources.json')) {
          throw new Error('The selected folder has no top-level horizon-resources.json. Select the prepared 26.3 resources folder.');
        }
        showProgress(`Saving ${entries.length} prepared files in this browser…`, 0, entries.length);
        try {
          await savePreparedFiles(entries);
          savedPaths = entries.map(entry => entry.path);
        } catch (storageError) {
          console.warn('Prepared files could not be saved for the next visit:', storageError);
          status.textContent = `Browser storage could not keep the files; loading them for this visit only…`;
        }
        updateButtons();
        await copyFilesIntoGame(entries, 'Copying prepared files');
        await launch(['--resources', '/resources', '--game-dir', '/game']);
      } catch (error) {
        console.error(error);
        hideProgress();
        status.textContent = `Could not start: ${error.message || error}`;
        updateButtons();
      }
    });
    // The game's last output lines, for the Copy game log button (mods that don't load say why here).
    const gameLog = [];
    function keepLog(text) {
      gameLog.push(String(text));
      if (gameLog.length > 1500) gameLog.splice(0, gameLog.length - 1500);
    }
    var Module = {
      canvas: document.querySelector('#canvas'),
      print: text => { keepLog(text); console.log(text); },
      printErr: text => { keepLog(text); console.error(text); },
      setStatus(message) {
        if (!runtimeReady && message) showProgress('Loading Horizon…');
      },
      monitorRunDependencies(remaining) {
        if (runtimeReady) return;
        runtimeDependenciesMax = Math.max(runtimeDependenciesMax, remaining);
        showProgress(
          'Loading Horizon…',
          runtimeDependenciesMax - remaining,
          runtimeDependenciesMax,
        );
      },
      async onRuntimeInitialized() {
        runtimeReady = true;
        hideProgress();
        if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
        window.setInterval(saveWorldsToBrowser, 3000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') void saveWorldsToBrowser();
        });
        window.addEventListener('pagehide', () => { void saveWorldsToBrowser(); });
        let storageUnavailable = false;
        try {
          savedPaths = await readSavedPaths();
        } catch (error) {
          console.error(error);
          storageUnavailable = true;
        }
        updateButtons();
        // An installed app keeps the loader and the wasm on disk too (see warmApp): a start with no
        // network then needs nothing from the server.
        if (matchMedia('(display-mode: standalone)').matches) void warmApp();
        status.textContent = storageUnavailable
          ? 'Runtime ready. Browser storage is unavailable.'
          : savedPaths
            ? 'Runtime ready. Play loads prepared files saved in this browser.'
            : 'Runtime ready. Press Play.';
      },
      onAbort(reason) { status.textContent = `Horizon stopped: ${reason}`; }
    };
  </script>
  <script src="/horizon-client.js"></script>
</body>
</html>
