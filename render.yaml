# Render blueprint for the browser build (docs/web.md, "Hosting on Render").
# A small Node service that serves web/dist (which `web/dist.ps1` fills) with the cross-origin
# isolation headers, plus `/mod-proxy`, the allow-listed route the in-game mod browser downloads
# through. Nothing is built on Render, and the service has no dependencies to install.
services:
  - type: web
    runtime: node
    name: horizon-web
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: node web/server.mjs
